[project]
name = "vulncouncil"
version = "0.1.0"
description = "Evidence-driven collective vulnerability triage in a synthetic local lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "pydantic==2.14.0",
  "httpx==0.28.1", "PyYAML==6.0.3", "agntcy-app-sdk==0.5.5",
  "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1"
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

